<!doctype html>

<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<canvas id="game"></canvas>

<div id="loading">
  <div class="box">
    <h1>热血传奇 1.76</h1>
    <div id="status">加载中…</div>
  </div>
</div>
<!-- 原版登录画面（ui.LoginScene）上的账号、密码框：网页表单，手机能弹键盘、浏览器能记密码 -->
<form id="login" class="hidden" autocomplete="on">
  <input id="account" name="account" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16">
  <input id="password" name="password" type="password" autocomplete="current-password" maxlength="64">
  <button type="submit" hidden></button>
</form>
<script type="module" src="js/main.js"></script>
</body>
