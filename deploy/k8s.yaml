# mir.leeliewhite.com → 宿主机上的 mir176 服务（systemd，监听 cni0 的 10.42.0.1:18176）
apiVersion: v1
kind: Namespace
metadata:
  name: mir176
---
apiVersion: v1
kind: Service
metadata:
  name: mir176
  namespace: mir176
spec:
  ports:
    - name: http
      port: 80
      targetPort: 18176
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mir176-host
  namespace: mir176
  labels:
    kubernetes.io/service-name: mir176
addressType: IPv4
ports:
  - name: http
    port: 18176
endpoints:
  - addresses: ["10.42.0.1"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: mir176
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mir176
  namespace: mir176
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: mir.leeliewhite.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mir176
                port:
                  name: http
  tls:
    - hosts: [mir.leeliewhite.com]
      secretName: mir176-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mir176-redirect
  namespace: mir176
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: mir176-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mir.leeliewhite.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mir176
                port:
                  name: http
